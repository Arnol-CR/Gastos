<style>
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>Mis Gastos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: una sola columna tipo app — resumen del mes arriba, gráfica diaria, lista agrupada por día, botón flotante para agregar */
:root{
  --bg:#eef2f6; --surface:#ffffff; --fg:#122033; --muted:#5f6f84; --line:#d9e1ea;
  --accent:#0f7c6f; --accent-soft:#d6efea; --bar:#9fb3c8; --danger:#b4372f; --good:#1d7a45;
  --display:"Manrope",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1522; --surface:#132235; --fg:#e8eef5; --muted:#91a2b7; --line:#22364d;
  --accent:#3cc3ae; --accent-soft:#12352f; --bar:#3b5674; --danger:#f0776d; --good:#5fd08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1522; --surface:#132235; --fg:#e8eef5; --muted:#91a2b7; --line:#22364d;
  --accent:#3cc3ae; --accent-soft:#12352f; --bar:#3b5674; --danger:#f0776d; --good:#5fd08f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:16px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mes{display:flex;align-items:center;gap:4px}
.mes button{background:none;border:0;width:40px;height:40px;border-radius:12px;font-size:20px;color:var(--muted)}
.mes button:hover{background:var(--surface)}
.mes span{font-weight:700;min-width:130px;text-align:center}
.respaldo{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

.resumen{text-align:center;display:flex;flex-direction:column;gap:4px;padding-block:8px}
.etq{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.total{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.total small{font-size:22px;color:var(--muted);font-weight:700;margin-right:4px}
.cambio{font-size:13px;font-weight:700}
.cambio.sube{color:var(--danger)} .cambio.baja{color:var(--good)} .cambio.igual{color:var(--muted)}

.grafica{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 12px 8px}
.grafica svg{display:block;width:100%;height:auto}
.grafica text{fill:var(--muted);font-family:var(--mono);font-size:10px}

.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-res{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.cat-res b{font-family:var(--mono);font-weight:600}

.dia{display:flex;flex-direction:column;gap:6px}
.dia-cab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700;padding:0 4px;text-transform:capitalize}
.gasto{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.gasto .txt{flex:1;min-width:0}
.gasto .txt div{font-weight:700}
.gasto .txt small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gasto .monto{font-weight:600}

.vacio{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.vacio b{color:var(--fg);font-size:17px}
.link{background:none;border:0;color:var(--accent);font-weight:700;text-decoration:underline;padding:4px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--accent);color:#fff;border:0;border-radius:999px;padding:16px 28px;font-weight:800;font-size:16px;
  box-shadow:0 8px 24px rgba(15,124,111,.35);z-index:5}
:root[data-theme="dark"] .fab{color:#06231f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#06231f}}

/* Hoja inferior */
.fondo{position:fixed;inset:0;background:rgba(5,12,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.hoja h2{margin:0;font-size:20px}
.campo-monto{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.campo-monto span{font-size:28px;font-weight:800;color:var(--muted)}
.campo-monto input{border:0;background:none;color:var(--fg);font:800 40px var(--mono);width:100%;min-width:0;outline:none}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600}
.chip span{font-size:22px}
.chip.sel{border-color:var(--accent);background:var(--accent-soft)}
.fila{display:flex;gap:10px}
.fila>*{flex:1;min-width:0}
.input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:600 16px var(--display)}
.acciones{display:flex;gap:10px}
.btn{flex:1;border-radius:14px;padding:14px;font-weight:800;border:1px solid var(--line);background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.peligro{color:var(--danger)}
textarea.input{min-height:120px;font:500 12px var(--mono)}
.nota{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.aviso{font-size:13px;font-weight:700;min-height:1em}
@media (prefers-reduced-motion:no-preference){.hoja{animation:sube .22s ease-out}@keyframes sube{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>


<div class="app">
  <div class="top">
    <div class="mes">
      <button id="mes-ant" aria-label="Mes anterior">‹</button>
      <span id="mes-nombre">—</span>
      <button id="mes-sig" aria-label="Mes siguiente">›</button>
    </div>
    <button class="respaldo" id="btn-respaldo">Respaldo</button>
  </div>

  <section class="resumen">
    <div class="etq">Gastado este mes</div>
    <div class="total"><small>L</small><span class="num" id="total">0.00</span></div>
    <div class="cambio igual" id="cambio">—</div>
  </section>

  <div class="grafica"><svg id="svg" viewBox="0 0 340 150" role="img" aria-label="Gasto por día del mes"></svg></div>

  <div class="cats" id="cats"></div>
  <div id="lista" style="display:flex;flex-direction:column;gap:16px"></div>
</div>

<button class="fab" id="btn-agregar">+ Agregar gasto</button>

<!-- Agregar / editar -->
<div class="fondo" id="hoja-gasto" hidden>
  <form class="hoja" id="form-gasto">
    <h2 id="hoja-titulo">Nuevo gasto</h2>
    <label class="campo-monto"><span>L</span><input id="g-monto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" required></label>
    <div class="chips" id="g-cats"></div>
    <div class="fila">
      <input class="input" id="g-nota" type="text" placeholder="Nota (opcional)" maxlength="60">
      <input class="input" id="g-fecha" type="date" required style="flex:0 0 46%">
    </div>
    <div class="aviso" id="g-aviso" style="color:var(--danger)"></div>
    <div class="acciones">
      <button type="button" class="btn peligro" id="g-borrar" hidden>Borrar</button>
      <button type="button" class="btn" id="g-cancelar">Cancelar</button>
      <button type="submit" class="btn pri">Guardar</button>
    </div>
  </form>
</div>

<!-- Respaldo -->
<div class="fondo" id="hoja-respaldo" hidden>
  <div class="hoja">
    <h2>Respaldo de tus datos</h2>
    <p class="nota">Tus gastos se guardan solo en este teléfono. Copia este texto y guárdalo en Notas o mándatelo por WhatsApp. Para recuperarlo, pégalo aquí y toca Restaurar.</p>
    <textarea class="input" id="r-texto" aria-label="Datos de respaldo"></textarea>
    <div class="aviso" id="r-aviso"></div>
    <div class="acciones">
      <button class="btn" id="r-copiar">Copiar</button>
      <button class="btn pri" id="r-restaurar">Restaurar</button>
    </div>
    <button class="btn" id="r-cerrar">Cerrar</button>
  </div>
</div>

<script>
const CATS = [
  {id:'comida', n:'Comida', i:'🍔'}, {id:'super', n:'Súper', i:'🛒'}, {id:'gasolina', n:'Gasolina', i:'⛽'},
  {id:'casa', n:'Casa', i:'🏠'}, {id:'servicios', n:'Luz y agua', i:'💡'}, {id:'telefono', n:'Teléfono', i:'📱'},
  {id:'salud', n:'Salud', i:'💊'}, {id:'otros', n:'Otros', i:'📦'}
];
const CLAVE = 'mis-gastos-v1';
const $ = id => document.getElementById(id);

let gastos = [];
try { gastos = JSON.parse(localStorage.getItem(CLAVE)) || [] } catch(e) { gastos = [] }
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(gastos)) } catch(e) {} }

const hoy = new Date();
let vista = { y: hoy.getFullYear(), m: hoy.getMonth() };
let editando = null, catSel = 'comida';

const fmt = n => Number(n).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cat = id => CATS.find(c => c.id === id) || CATS[CATS.length-1];
const delMes = (y,m) => gastos.filter(g => { const [gy,gm] = g.fecha.split('-').map(Number); return gy===y && gm-1===m });
const suma = arr => arr.reduce((s,g)=>s+Number(g.monto),0);

function pintar(){
  const {y,m} = vista;
  const nm = new Date(y,m,1).toLocaleDateString('es-HN',{month:'long',year:'numeric'});
  $('mes-nombre').textContent = nm.charAt(0).toUpperCase() + nm.slice(1);
  const lista = delMes(y,m);
  const total = suma(lista);
  $('total').textContent = fmt(total);

  const pm = m===0 ? {y:y-1,m:11} : {y,m:m-1};
  const prev = suma(delMes(pm.y,pm.m));
  const c = $('cambio');
  if (!prev) { c.className='cambio igual'; c.textContent = 'Sin datos del mes anterior' }
  else {
    const p = Math.round((total-prev)/prev*100);
    const nomPrev = new Date(pm.y,pm.m,1).toLocaleDateString('es-HN',{month:'short'}).replace('.','');
    c.className = 'cambio ' + (p>0?'sube':p<0?'baja':'igual');
    c.textContent = `${p>0?'▲':p<0?'▼':'='} ${Math.abs(p)}% frente a ${nomPrev} (L ${fmt(prev)})`;
  }

  grafica(lista, y, m);

  // Por categoría
  const porCat = {};
  lista.forEach(g => porCat[g.cat] = (porCat[g.cat]||0) + Number(g.monto));
  $('cats').innerHTML = Object.entries(porCat).sort((a,b)=>b[1]-a[1])
    .map(([id,v]) => `<div class="cat-res">${cat(id).i} ${cat(id).n} <b>L ${fmt(v)}</b></div>`).join('');

  // Lista por día
  const cont = $('lista');
  if (!lista.length){
    cont.innerHTML = `<div class="vacio"><b>Sin gastos este mes</b><span>Toca <strong>+ Agregar gasto</strong> para anotar el primero.</span>${gastos.length?'':'<button class="link" id="btn-ejemplo">Ver con datos de ejemplo</button>'}</div>`;
    const be = $('btn-ejemplo'); if (be) be.onclick = cargarEjemplo;
    return;
  }
  const dias = {};
  lista.forEach(g => (dias[g.fecha] ||= []).push(g));
  const hoyIso = iso(new Date()), ayer = new Date(); ayer.setDate(ayer.getDate()-1);
  cont.innerHTML = Object.keys(dias).sort().reverse().map(f => {
    const [fy,fm,fd] = f.split('-').map(Number);
    const nom = f===hoyIso ? 'Hoy' : f===iso(ayer) ? 'Ayer' : new Date(fy,fm-1,fd).toLocaleDateString('es-HN',{weekday:'long',day:'numeric',month:'short'});
    return `<div class="dia"><div class="dia-cab"><span>${nom}</span><span class="num">L ${fmt(suma(dias[f]))}</span></div>
      ${dias[f].map(g => `<button class="gasto" data-id="${g.id}"><div class="ico">${cat(g.cat).i}</div>
        <div class="txt"><div>${cat(g.cat).n}</div>${g.nota?`<small>${esc(g.nota)}</small>`:''}</div>
        <div class="monto num">L ${fmt(g.monto)}</div></button>`).join('')}</div>`;
  }).join('');
  cont.querySelectorAll('.gasto').forEach(b => b.onclick = () => abrir(gastos.find(g => g.id === b.dataset.id)));
}

function esc(t){ return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }

function grafica(lista, y, m){
  const dias = new Date(y,m+1,0).getDate();
  const v = Array(dias).fill(0);
  lista.forEach(g => v[Number(g.fecha.split('-')[2])-1] += Number(g.monto));
  const max = Math.max(...v, 1);
  const conDatos = v.filter(x=>x>0);
  const prom = conDatos.length ? suma(lista)/conDatos.length : 0;
  const W=340, H=150, izq=4, der=58, arr=10, aba=22, ancho=(W-izq-der)/dias, alto=H-arr-aba;
  const yv = x => arr + alto - (x/max)*alto;
  const esHoy = (y===hoy.getFullYear() && m===hoy.getMonth()) ? hoy.getDate() : 0;
  let s = '';
  v.forEach((x,i) => {
    const h = Math.max((x/max)*alto, x>0?3:1.5);
    const col = (i+1)===esHoy ? 'var(--accent)' : x>0 ? 'var(--bar)' : 'var(--line)';
    s += `<rect x="${(izq+i*ancho+ancho*.18).toFixed(1)}" y="${(arr+alto-h).toFixed(1)}" width="${(ancho*.64).toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(2,ancho*.3).toFixed(1)}" fill="${col}"/>`;
  });
  [1,8,15,22,dias].forEach(d => s += `<text x="${(izq+(d-.5)*ancho).toFixed(1)}" y="${H-6}" text-anchor="middle">${d}</text>`);
  s += `<text x="${W-der+6}" y="${arr+8}">${Math.round(max)}</text>`;
  if (prom){
    const py = yv(prom);
    s += `<line x1="${izq}" x2="${W-der}" y1="${py.toFixed(1)}" y2="${py.toFixed(1)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/>`;
    s += `<text x="${W-der+6}" y="${(py+3).toFixed(1)}">prom ${Math.round(prom)}</text>`;
  }
  $('svg').innerHTML = s;
}

// Hoja de gasto
$('g-cats').innerHTML = CATS.map(c => `<button type="button" class="chip" data-c="${c.id}"><span>${c.i}</span>${c.n}</button>`).join('');
$('g-cats').querySelectorAll('.chip').forEach(b => b.onclick = () => { catSel = b.dataset.c; marcarCat() });
function marcarCat(){ $('g-cats').querySelectorAll('.chip').forEach(b => b.classList.toggle('sel', b.dataset.c===catSel)) }

function abrir(g){
  editando = g || null;
  $('hoja-titulo').textContent = g ? 'Editar gasto' : 'Nuevo gasto';
  $('g-monto').value = g ? g.monto : '';
  $('g-nota').value  = g ? (g.nota||'') : '';
  const enVista = (vista.y===hoy.getFullYear() && vista.m===hoy.getMonth()) ? iso(hoy) : iso(new Date(vista.y,vista.m,1));
  $('g-fecha').value = g ? g.fecha : enVista;
  catSel = g ? g.cat : 'comida'; marcarCat();
  $('g-borrar').hidden = !g; $('g-borrar').textContent = 'Borrar'; $('g-aviso').textContent = '';
  $('hoja-gasto').hidden = false;
  setTimeout(() => $('g-monto').focus(), 60);
}
function cerrar(){ $('hoja-gasto').hidden = true; editando = null }

$('btn-agregar').onclick = () => abrir();
$('g-cancelar').onclick = cerrar;
$('hoja-gasto').onclick = e => { if (e.target.id==='hoja-gasto') cerrar() };
$('form-gasto').onsubmit = e => {
  e.preventDefault();
  const monto = Math.round(Number($('g-monto').value)*100)/100;
  if (!(monto > 0)) { $('g-aviso').textContent = 'Escribe un monto mayor que cero.'; return }
  const datos = { monto, cat: catSel, nota: $('g-nota').value.trim(), fecha: $('g-fecha').value || iso(hoy) };
  if (editando) Object.assign(editando, datos);
  else gastos.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), ...datos });
  const [fy,fm] = datos.fecha.split('-').map(Number); vista = { y: fy, m: fm-1 };
  guardar(); cerrar(); pintar();
};
$('g-borrar').onclick = () => {
  const b = $('g-borrar');
  if (b.textContent === 'Borrar') { b.textContent = '¿Seguro? Toca otra vez'; return }
  gastos = gastos.filter(g => g !== editando); guardar(); cerrar(); pintar();
};

$('mes-ant').onclick = () => { vista = vista.m===0 ? {y:vista.y-1,m:11} : {y:vista.y,m:vista.m-1}; pintar() };
$('mes-sig').onclick = () => { vista = vista.m===11 ? {y:vista.y+1,m:0} : {y:vista.y,m:vista.m+1}; pintar() };

// Respaldo
$('btn-respaldo').onclick = () => { $('r-texto').value = JSON.stringify(gastos); $('r-aviso').textContent=''; $('hoja-respaldo').hidden = false };
$('r-cerrar').onclick = () => $('hoja-respaldo').hidden = true;
$('hoja-respaldo').onclick = e => { if (e.target.id==='hoja-respaldo') $('hoja-respaldo').hidden = true };
$('r-copiar').onclick = () => {
  const t = $('r-texto');
  navigator.clipboard?.writeText(t.value).then(() => $('r-aviso').textContent = 'Copiado. Pégalo en Notas o WhatsApp.')
    .catch(() => { t.select(); $('r-aviso').textContent = 'Texto seleccionado: mantén presionado y toca Copiar.' })
    ?? (t.select(), $('r-aviso').textContent = 'Texto seleccionado: mantén presionado y toca Copiar.');
};
$('r-restaurar').onclick = () => {
  try {
    const d = JSON.parse($('r-texto').value);
    if (!Array.isArray(d) || !d.every(g => g && g.id && g.fecha && Number(g.monto) > 0)) throw 0;
    gastos = d; guardar(); pintar();
    $('r-aviso').textContent = `Listo: ${d.length} gastos restaurados.`;
  } catch(e) { $('r-aviso').textContent = 'Ese texto no es un respaldo válido. Pega el texto completo que copiaste.' }
};

function cargarEjemplo(){
  const y = hoy.getFullYear(), m = hoy.getMonth(), d = hoy.getDate();
  const ej = [[1,'super',1240,'Despensa (ejemplo)'],[2,'gasolina',800,'Ejemplo'],[3,'comida',250,'Almuerzo (ejemplo)'],
    [5,'servicios',1150,'Luz ENEE (ejemplo)'],[7,'comida',180,'Ejemplo'],[9,'telefono',350,'Recarga (ejemplo)'],
    [12,'gasolina',700,'Ejemplo'],[14,'salud',420,'Farmacia (ejemplo)'],[16,'comida',310,'Ejemplo'],[20,'casa',600,'Ejemplo']];
  ej.filter(e => e[0] <= d).forEach(([dia,c,mo,n],i) => gastos.push({ id:'ej'+i, cat:c, monto:mo, nota:n, fecha: iso(new Date(y,m,dia)) }));
  pintar();   // los ejemplos no se guardan: desaparecen al recargar
}

pintar();
</script>
